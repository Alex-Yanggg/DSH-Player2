name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 6.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
      - name: Check whitespace
        run: git show --check --format= HEAD
      - name: Verify documentation
        run: node scripts/verify-docs.mjs
      - name: Test Player2 core rules
        run: dotnet test player2-core.tests/DSHPlayer2.Core.Tests.csproj --configuration Release
      - name: Verify TypeScript core
        # Build first: project-reference typechecks read contracts' declared
        # dist outputs, which only exist after the build on a fresh checkout.
        run: npm ci && npm run build && npm run typecheck && npm test
