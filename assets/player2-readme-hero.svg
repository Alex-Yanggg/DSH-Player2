    <text x="24" y="38" fill="#e9fff9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Game facts</text>
    <text x="24" y="66" fill="#a9c9c1" font-family="Segoe UI, Arial, sans-serif" font-size="16">bounded observations</text>
  </g>
