<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DSH-Player2 product flow</title>
  <desc id="desc">A stylized diagram showing game facts, consent, receipt memory, and native companion presence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101820"/>
      <stop offset="0.55" stop-color="#17231f"/>
      <stop offset="1" stop-color="#241a12"/>
    </linearGradient>
    <linearGradient id="gold" x1="162" y1="90" x2="1117" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2c46d"/>
      <stop offset="1" stop-color="#f47f45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="30" fill="url(#bg)"/>
  <rect x="36" y="36" width="1208" height="448" rx="26" fill="#0b0f12" fill-opacity="0.42" stroke="#f2c46d" stroke-opacity="0.22"/>
