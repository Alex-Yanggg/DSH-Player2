[pytest]
testpaths = tests
addopts = -p no:cacheprovider -ra
markers =
    boot: game starts, mod loads, save loads, the mod starts DSH (acp profile)
    presence: the companion exists in the world
    conversation: F2 chat reaches DSH and back
    movement: explicit come / follow / stay commands drive the companion at once, without waiting for DSH
    boundaries: unsupported requests are refused honestly, nothing is faked
    feel: latency and responsiveness measurements
    bline: goals asked in chat make the companion's own body act, and /stay takes the body back
    live: needs the real game on this machine (everything except tests/unit)
